name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -v

      - name: Verify agent ledger integrity
        run: python3 docs/agents/tools/ledger-lint.py

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pricemonitor_ci
          POSTGRES_USER: pricemonitor
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://pricemonitor:ci_test_password@localhost:5432/pricemonitor_ci
      ENVIRONMENT: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed PostgreSQL 16 and verify FastAPI health & auth
        run: |
          python -m app.db.seed
          python -m app.db.seed
          python -c "
          from fastapi.testclient import TestClient
          from app.core.config import settings
          from app.main import app
          with TestClient(app) as client:
              h = client.get('/health')
              assert h.status_code == 200 and h.json()['database'] == 'ok', h.text
              r = client.post('/login', data={'email': settings.SEED_USER_EMAIL, 'password': settings.SEED_USER_PASSWORD}, follow_redirects=False)
              assert r.status_code == 303
              w = client.get('/watchlist')
              assert w.status_code == 200 and '553558-403' in w.text
          print('PostgreSQL 16 smoke check ok')
          "
